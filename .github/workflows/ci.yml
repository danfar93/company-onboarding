name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # allow the test reporter to publish a results check

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() # report results even when tests fail
        with:
          name: Backend test results
          path: backend/test-results/junit.xml
          reporter: java-junit

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/junit.xml
          if-no-files-found: ignore

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Mobile test results
          path: mobile/test-results/junit.xml
          reporter: java-junit

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: mobile/test-results/junit.xml
          if-no-files-found: ignore
