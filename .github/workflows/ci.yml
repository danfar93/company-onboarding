name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # test-results check
  pull-requests: write # comment the results table on the PR

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() # vitest writes JUnit even when tests fail
        with:
          name: backend-test-results
          path: backend/test-results/junit.xml
          if-no-files-found: ignore

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: mobile/test-results/junit.xml
          if-no-files-found: ignore

  report:
    name: Test Results
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: always() # report even if a suite failed
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish results table to the PR
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: artifacts/**/junit.xml
          check_name: Test Results
          comment_title: Test Results
          comment_mode: always
