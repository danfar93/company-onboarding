name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix mobile

      - name: Backend
        id: backend
        working-directory: backend
        continue-on-error: true
        run: |
          npm run typecheck
          npm test

      - name: Mobile
        id: mobile
        working-directory: mobile
        continue-on-error: true
        run: |
          npm run typecheck
          npm test

      - name: Comment test results table on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const decode = (s) => s
              .replace(/&gt;/g, '>').replace(/&lt;/g, '<')
              .replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'")
              .replace(/&amp;/g, '&');
            // (?:^|\\s) so `name` doesn't also match inside `classname`.
            const attr = (tag, name) => {
              const m = tag.match(new RegExp(`(?:^|\\s)${name}="([^"]*)"`));
              return m ? decode(m[1]) : '';
            };
            function parse(file) {
              if (!fs.existsSync(file)) return [];
              const xml = fs.readFileSync(file, 'utf8');
              const cases = [];
              const re = /<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
              let m;
              while ((m = re.exec(xml))) {
                const inner = m[2] || '';
                const status = /<failure/.test(inner) ? 'failed'
                  : /<skipped/.test(inner) ? 'skipped' : 'passed';
                cases.push({ suite: path.basename(attr(m[1], 'classname')), name: attr(m[1], 'name'), status });
              }
              return cases;
            }
            const ICON = { passed: '✅', failed: '❌', skipped: '⏭️' };
            const tally = (cs) => {
              const t = { total: cs.length, passed: 0, failed: 0, skipped: 0 };
              for (const c of cs) t[c.status]++;
              t.suites = new Set(cs.map((c) => c.suite)).size;
              return t;
            };
            function details(label, cs) {
              const t = tally(cs);
              if (!cs.length) return `<details><summary><b>${label}</b> — no results</summary>\n\n_No test output was produced._\n</details>`;
              const rows = cs.map((c) => `| \`${c.suite}\` | ${c.name.replace(/ > /g, ' › ')} | ${ICON[c.status]} |`).join('\n');
              return [
                `<details${t.failed ? ' open' : ''}><summary><b>${label}</b> — ${t.total} tests${t.failed ? `, ${t.failed} failed ❌` : ' ✅'}</summary>`,
                '', '| Suite | Test | Result |', '| :-- | :-- | :--: |', rows, '</details>',
              ].join('\n');
            }
            const backend = parse('backend/test-results/junit.xml');
            const mobile = parse('mobile/test-results/junit.xml');
            const b = tally(backend), m = tally(mobile);
            const failed = b.failed + m.failed;
            const marker = '<!-- ci-test-results -->';
            const body = [
              marker,
              `## 🧪 Test Results — ${failed ? `${failed} failed ❌` : 'all passing ✅'}`,
              '',
              '| Package | Suites | Tests | ✅ Passed | ❌ Failed | ⏭️ Skipped |',
              '| :-- | --: | --: | --: | --: | --: |',
              `| **Backend** | ${b.suites} | ${b.total} | ${b.passed} | ${b.failed} | ${b.skipped} |`,
              `| **Mobile** | ${m.suites} | ${m.total} | ${m.passed} | ${m.failed} | ${m.skipped} |`,
              `| **Total** | ${b.suites + m.suites} | ${b.total + m.total} | ${b.passed + m.passed} | ${b.failed + m.failed} | ${b.skipped + m.skipped} |`,
              '',
              details('Backend', backend),
              '',
              details('Mobile', mobile),
              '',
              `<sub>Updated for ${context.sha.slice(0, 7)}</sub>`,
            ].join('\n');
            const issue_number = context.issue.number;
            if (!issue_number) return;
            const { owner, repo } = context.repo;
            try {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              core.warning(`Could not post results comment (likely a fork PR with a read-only token): ${err.message}`);
            }

      - name: Fail if any suite failed
        if: steps.backend.outcome == 'failure' || steps.mobile.outcome == 'failure'
        run: exit 1